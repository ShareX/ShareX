<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareX Icons</title>
<style>
  :root {
    --bg: #1c1c20;
    --panel: #26262c;
    --text: #e8e8ee;
    --muted: #9a9aa6;
    --border: #3a3a44;
    --accent: #2f7bc4;
  }
  body.light {
    --bg: #f4f4f6;
    --panel: #ffffff;
    --text: #1e1e24;
    --muted: #70707c;
    --border: #dcdce2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
    padding: 12px 16px 8px;
  }
  .tabs { display: flex; gap: 4px; padding: 0 8px; }
  .tabs button.tab {
    margin-bottom: -1px;
    padding: 8px 14px;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    background: none;
    color: var(--muted);
    font-weight: 600;
  }
  .tabs button.tab:hover { color: var(--text); }
  .tabs button.tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab .badge {
    margin-left: 6px;
    padding: 1px 7px;
    border-radius: 10px;
    background: var(--bg);
    color: var(--muted);
    font-size: 11px;
    font-weight: 400;
  }
  .tab.active .badge { background: var(--accent); color: #fff; }
  h1 { margin: 0; font-size: 16px; font-weight: 600; }
  .count { color: var(--muted); }
  input[type=search] {
    flex: 1 1 200px;
    max-width: 320px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  .group { display: flex; gap: 4px; align-items: center; }
  .group span { color: var(--muted); margin-right: 4px; }
  button {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  main {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--cell), 1fr));
    gap: 8px;
    padding: 16px;
  }
  .icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px 6px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    min-width: 0;
  }
  .icon:hover { border-color: var(--accent); }
  .icon img { width: var(--size); height: var(--size); }
  /* Modern icons are drawn in currentColor, which is black in an img, so they are inverted on dark. */
  body:not(.light).modern .icon img { filter: invert(1) hue-rotate(180deg); }
  .icon .name {
    width: 100%;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .icon.copied .name { color: var(--accent); }
  .group-title {
    grid-column: 1 / -1;
    margin: 12px 0 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }
  .group-title:first-child { margin-top: 0; }
  .empty { grid-column: 1 / -1; color: var(--muted); }
</style>
</head>
<body class="modern">
<header>
  <div class="bar">
    <h1>ShareX Icons</h1>
    <input type="search" id="search" placeholder="Filter by name" autofocus>
    <span class="count" id="count"></span>
    <div class="group" id="sizes"><span>Size</span></div>
    <div class="group"><span>Theme</span><button id="dark">Dark</button><button id="light">Light</button></div>
  </div>
  <nav class="tabs" id="packs" role="tablist"></nav>
</header>

};
const sizes = [16, 20, 24, 32, 48, 64];
const grid = document.getElementById("grid");
const count = document.getElementById("count");
const search = document.getElementById("search");
let pack = location.hash.toLowerCase() === "#legacy" ? "Legacy" : "Modern";

function groupOf(name, other) {
  const dot = name.indexOf(".");
  return dot > 0 ? name.slice(0, dot) : other;
}

function render() {
  const { folder, other, icons } = packs[pack];
  const filter = search.value.trim().toLowerCase();
  const shown = icons.filter(name => name.toLowerCase().includes(filter));
  grid.replaceChildren();
  let lastGroup = null;
  for (const name of shown) {
    const group = groupOf(name, other);
    if (group !== lastGroup) {
      const title = document.createElement("h2");
      title.className = "group-title";
      title.textContent = group;
      grid.append(title);
      lastGroup = group;
    }
    const cell = document.createElement("div");
    cell.className = "icon";
    cell.title = `${folder}/${name}.svg (click to copy the name)`;
    const img = document.createElement("img");
    img.src = `${folder}/${name}.svg`;
    img.alt = name;
    img.loading = "lazy";
    const label = document.createElement("div");
    label.className = "name";
    label.textContent = name;
    cell.append(img, label);
    cell.addEventListener("click", () => {
      navigator.clipboard?.writeText(name).catch(() => {});
      cell.classList.add("copied");
      setTimeout(() => cell.classList.remove("copied"), 800);
    });
    grid.append(cell);
  }
  if (shown.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "No icons match the filter.";
    grid.append(empty);
  }
  count.textContent = shown.length === icons.length ? `${icons.length} icons` : `${shown.length} of ${icons.length} icons`;
}

function setPack(value) {
  pack = value;
  document.body.classList.toggle("modern", pack === "Modern");
  for (const tab of document.querySelectorAll("#packs .tab")) {
    const selected = tab.dataset.pack === pack;
    tab.classList.toggle("active", selected);
    tab.setAttribute("aria-selected", selected);
  }
  history.replaceState(null, "", pack === "Legacy" ? "#legacy" : location.pathname + location.search);
  render();
}

function setSize(value) {
  document.documentElement.style.setProperty("--size", value + "px");
  document.documentElement.style.setProperty("--cell", Math.max(110, value + 40) + "px");
  for (const button of document.querySelectorAll("#sizes button")) button.classList.toggle("on", +button.dataset.size === value);
}

function setTheme(dark) {
  document.body.classList.toggle("light", !dark);
  document.getElementById("dark").classList.toggle("on", dark);
  document.getElementById("light").classList.toggle("on", !dark);
}

for (const [name, { icons }] of Object.entries(packs)) {
  const button = document.createElement("button");
  button.className = "tab";
  button.setAttribute("role", "tab");
  button.textContent = name;
  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = icons.length;
  button.append(badge);
  button.dataset.pack = name;
  button.addEventListener("click", () => setPack(name));
  document.getElementById("packs").append(button);
}
for (const value of sizes) {
  const button = document.createElement("button");
  button.textContent = value;
  button.dataset.size = value;
  button.addEventListener("click", () => setSize(value));
  document.getElementById("sizes").append(button);
}
document.getElementById("dark").addEventListener("click", () => setTheme(true));
document.getElementById("light").addEventListener("click", () => setTheme(false));
search.addEventListener("input", render);

setSize(32);
setTheme(true);
setPack(pack);
</script>
