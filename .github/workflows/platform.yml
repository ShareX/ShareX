name: Cross-platform

on:
  push:
    # Temporary while the cross-platform port is in progress.
    branches-ignore:
      - "cross-platform-v2"
    paths:
      - "ShareX*/**"
      - "Directory.Build.*"
      - "Directory.Packages.props"
      - "ShareX.sln"
      - ".github/workflows/platform.yml"
  pull_request:
    branches-ignore:
      - "cross-platform-v2"
    paths:
      - "ShareX*/**"
      - "Directory.Build.*"
      - "Directory.Packages.props"
      - "ShareX.sln"
      - ".github/workflows/platform.yml"

permissions:
  contents: read

jobs:
  test:
    if: github.head_ref != 'cross-platform-v2'
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Each platform project builds on every OS. Native Windows tests skip on other hosts.
      - name: Build platform projects
        run: |
          dotnet build ShareX.Platform.Linux/ShareX.Platform.Linux.csproj --configuration Release
          dotnet build ShareX.Platform.MacOS/ShareX.Platform.MacOS.csproj --configuration Release
          dotnet build ShareX.Platform.Windows/ShareX.Platform.Windows.csproj --configuration Release

      - name: Test platform layer
        run: dotnet test ShareX.Platform.Tests/ShareX.Platform.Tests.csproj --configuration Release --logger "console;verbosity=normal"

      - name: Test editor graphics
        run: dotnet test ShareX.ImageEditor.Tests/ShareX.ImageEditor.Tests.csproj --configuration Release --logger "console;verbosity=normal"

      # Tools still need the Windows desktop runtime until M5/M3 retarget them.
      - name: Test tool UI
        if: runner.os == 'Windows'
        run: dotnet test ShareX.Tools.Tests/ShareX.Tools.Tests.csproj --configuration Release -p:Platform=x64 --logger "console;verbosity=normal"

      - name: Test image effects
        run: dotnet test ShareX.ImageEffectsLib.Tests/ShareX.ImageEffectsLib.Tests.csproj --configuration Release -p:Platform=x64 --logger "console;verbosity=normal"

  build-solution:
    if: github.head_ref != 'cross-platform-v2'
    name: Build solution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Windows-only projects compile on any OS through EnableWindowsTargeting (set in Directory.Build.props). They cannot run off Windows yet.
      - name: Build ShareX.sln
        run: dotnet build ShareX.sln --configuration Release -p:Platform=x64
