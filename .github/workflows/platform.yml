name: Portable libraries

on:
  push:
    branches:
      - "**"
    paths:
      - "ShareX.Platform*/**"
      - "ShareX.Destinations*/**"
      - "ShareX.Desktop*/**"
      - "ShareX.HelpersLib*/**"
      - "ShareX.UploadersLib/**"
      - "ShareX.ImageEffectsLib*/**"
      - "ShareX.HistoryLib/**"
      - "Directory.Build.*"
      - ".github/workflows/platform.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "ShareX.Platform*/**"
      - "ShareX.Destinations*/**"
      - "ShareX.Desktop*/**"
      - "ShareX.HelpersLib*/**"
      - "ShareX.UploadersLib/**"
      - "ShareX.ImageEffectsLib*/**"
      - "ShareX.HistoryLib/**"
      - "Directory.Build.*"
      - ".github/workflows/platform.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Each platform project builds on every OS. The tests exercise parsing and argument generation, so they run everywhere too.
      - name: Build platform projects
        run: |
          dotnet build ShareX.Platform.Linux/ShareX.Platform.Linux.csproj --configuration Release
          dotnet build ShareX.Platform.MacOS/ShareX.Platform.MacOS.csproj --configuration Release
          dotnet build ShareX.Platform.Windows/ShareX.Platform.Windows.csproj --configuration Release

      - name: Test platform layer
        run: dotnet test ShareX.Platform.Tests/ShareX.Platform.Tests.csproj --configuration Release --logger "console;verbosity=normal"

      - name: Test destination routing
        run: dotnet test ShareX.Destinations.Tests/ShareX.Destinations.Tests.csproj --configuration Release --logger "console;verbosity=normal"

      - name: Test image effects
        run: dotnet test ShareX.ImageEffectsLib.Tests/ShareX.ImageEffectsLib.Tests.csproj --configuration Release --logger "console;verbosity=normal"

      # Runs the cross-platform application's workflow, single-instance channel and the real uploaders against a local server.
      - name: Test the desktop application
        run: dotnet test ShareX.Desktop.Tests/ShareX.Desktop.Tests.csproj --configuration Release --logger "console;verbosity=normal"

  build-solution:
    name: Build solution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Windows-only projects compile on any OS through EnableWindowsTargeting (set in Directory.Build.props). They cannot run off Windows yet.
      - name: Build ShareX.sln
        run: dotnet build ShareX.sln --configuration Release -p:Platform=x64
