name: Cross-platform

# Runs only when started by hand (Actions tab, or `gh workflow run platform.yml --ref cross-platform`), for example through the
# publish-release skill. It tests on all three systems, packages Linux and macOS, and keeps the packages as run artifacts.
# Nothing is published as a GitHub release: ShareX's update checker reads this repository's releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The test host must match the runner's CPU (macos-latest is Apple silicon).
      - name: Pick test platform
        shell: bash
        run: echo "TEST_PLATFORM=$([ "$RUNNER_ARCH" = ARM64 ] && echo ARM64 || echo x64)" >> "$GITHUB_ENV"

      # Each platform project builds on every OS. Native Windows tests skip on other hosts.
      - name: Build platform projects
        run: |
          dotnet build ShareX.Platform.Linux/ShareX.Platform.Linux.csproj --configuration Release
          dotnet build ShareX.Platform.MacOS/ShareX.Platform.MacOS.csproj --configuration Release
          dotnet build ShareX.Platform.Windows/ShareX.Platform.Windows.csproj --configuration Release

      - name: Test platform layer
        run: dotnet test ShareX.Platform.Tests/ShareX.Platform.Tests.csproj --configuration Release --logger "console;verbosity=normal"

      - name: Test editor graphics
        run: dotnet test ShareX.ImageEditor.Tests/ShareX.ImageEditor.Tests.csproj --configuration Release --logger "console;verbosity=normal"

      - name: Test tool UI
        run: dotnet test ShareX.Tools.Tests/ShareX.Tools.Tests.csproj --configuration Release -p:Platform=${{ env.TEST_PLATFORM }} --logger "console;verbosity=normal"

      - name: Test history storage
        run: dotnet test ShareX.HistoryLib.Tests/ShareX.HistoryLib.Tests.csproj --configuration Release -p:Platform=${{ env.TEST_PLATFORM }} --logger "console;verbosity=normal"

      - name: Test image effects
        run: dotnet test ShareX.ImageEffectsLib.Tests/ShareX.ImageEffectsLib.Tests.csproj --configuration Release -p:Platform=${{ env.TEST_PLATFORM }} --logger "console;verbosity=normal"

  build-solution:
    name: Build solution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Windows-only projects compile on any OS through EnableWindowsTargeting (set in Directory.Build.props). They cannot run off Windows yet.
      - name: Build ShareX.sln
        run: dotnet build ShareX.sln --configuration Release -p:Platform=x64

  macos-app:
    name: macOS app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      HAS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
      # How long to wait for Apple's verdict on the notarization submission. The review of a new
      # Developer ID team's first submissions can take hours, and the wait costs nothing: the job
      # is idle either way, and without the verdict the build ships signed but unstapled, which
      # Gatekeeper rejects. If the review still has not finished, the build is still published.
      MACOS_NOTARY_TIMEOUT: 14400

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version
        shell: bash
        run: echo "SHAREX_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # A release build is signed with Developer ID and notarized when the repository has these secrets: MACOS_CERTIFICATE (the
      # Developer ID Application .p12, base64), MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_IDENTITY, and MACOS_NOTARY_KEY (an App
      # Store Connect API key .p8, base64), MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER. Without them the bundle is signed ad hoc.
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$MACOS_NOTARY_KEY" ]; then
            echo "$MACOS_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            { echo "MACOS_NOTARY_KEY=$RUNNER_TEMP/notary.p8"; echo "MACOS_NOTARY_KEY_ID=$MACOS_NOTARY_KEY_ID"; echo "MACOS_NOTARY_ISSUER=$MACOS_NOTARY_ISSUER"; } >> "$GITHUB_ENV"
          fi

      - name: Package ShareX.app
        run: |
          Scripts/package-macos.sh ${{ matrix.arch }} "$RUNNER_TEMP/package"
          ditto -x -k "$RUNNER_TEMP"/package/ShareX-*-macos-${{ matrix.arch }}.zip "$RUNNER_TEMP/app"
          plutil -lint "$RUNNER_TEMP/app/ShareX.app/Contents/Info.plist"
          codesign --verify --strict --deep "$RUNNER_TEMP/app/ShareX.app"
          hdiutil verify "$RUNNER_TEMP"/package/ShareX-*-macos-${{ matrix.arch }}.dmg
          # Gatekeeper accepts the app only once Apple has notarized it, which can still be pending for a new Developer ID team.
          if xcrun stapler validate -q "$RUNNER_TEMP/app/ShareX.app" 2>/dev/null; then spctl --assess --type execute --verbose "$RUNNER_TEMP/app/ShareX.app"; fi

      # Starts the bundle with a clean home (welcome screen off, as for a returning user), waits for startup and closes it with
      # SIGTERM, which must save the settings. Nothing is captured or uploaded.
      - name: Launch ShareX.app
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME/Documents/ShareX"
          echo '{ "ShowStartScreen": false }' > "$HOME/Documents/ShareX/ApplicationConfig.json"
          "$RUNNER_TEMP/app/ShareX.app/Contents/MacOS/ShareX" -silent & pid=$!
          log="$HOME/Documents/ShareX/Logs"
          for i in $(seq 1 90); do
            grep -qs "Startup time" "$log"/ShareX-Log-*.txt && break
            sleep 1
          done
          kill -TERM "$pid"
          wait "$pid" || true
          cat "$log"/ShareX-Log-*.txt
          grep -q "Startup time" "$log"/ShareX-Log-*.txt
          grep -q "ShareX closed" "$log"/ShareX-Log-*.txt
          ! grep -q "Unhandled exception" "$log"/ShareX-Log-*.txt

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ShareX-${{ env.SHAREX_VERSION }}-macos-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/package/*.zip
            ${{ runner.temp }}/package/*.dmg
          if-no-files-found: error

      - name: Remove signing keychain
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/signing.keychain-db" ] && security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"

  linux:
    name: Linux packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            tools: x86_64
            nfpm: nfpm_2.48.0_Linux_x86_64.tar.gz
            nfpm_sha256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - arch: arm64
            runner: ubuntu-24.04-arm
            tools: aarch64
            nfpm: nfpm_2.48.0_Linux_arm64.tar.gz
            nfpm_sha256: a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version
        shell: bash
        run: echo "SHAREX_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The test job covers the libraries on every system; this checks the whole solution once.
      - name: Build ShareX.sln
        if: matrix.arch == 'x64'
        run: dotnet build ShareX.sln --configuration Release -p:Platform=x64

      - name: Test
        if: matrix.arch == 'x64'
        run: |
          for project in ShareX.Platform.Tests ShareX.HistoryLib.Tests ShareX.ImageEditor.Tests ShareX.ImageEffectsLib.Tests ShareX.Tools.Tests; do
            dotnet test "$project/$project.csproj" --configuration Release -p:Platform=x64 --no-build --logger "console;verbosity=minimal"
          done

      # Pinned releases, checked against their SHA-256.
      - name: Install packaging tools
        run: |
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/nfpm.tar.gz" "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/${{ matrix.nfpm }}"
          curl -fsSL -o "$tools/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.tools }}.AppImage"
          curl -fsSL -o "$tools/runtime" "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${{ matrix.tools }}"
          sha256sum -c - <<SUMS
          ${{ matrix.nfpm_sha256 }}  $tools/nfpm.tar.gz
          ${{ matrix.appimagetool_sha256 }}  $tools/appimagetool
          ${{ matrix.runtime_sha256 }}  $tools/runtime
          SUMS
          tar -C "$tools" -xzf "$tools/nfpm.tar.gz" nfpm
          chmod +x "$tools/appimagetool"
          sudo apt-get update -q && sudo apt-get install -yq xvfb dbus-x11 >/dev/null

      - name: Package
        env:
          NFPM: ${{ runner.temp }}/tools/nfpm
          APPIMAGETOOL: ${{ runner.temp }}/tools/appimagetool
          APPIMAGE_RUNTIME: ${{ runner.temp }}/tools/runtime
          # The runner has no FUSE for appimagetool's own AppImage.
          APPIMAGE_EXTRACT_AND_RUN: 1
          SHAREX_PRERELEASE: dev${{ github.run_number }}
        run: |
          Scripts/install-linux.sh --package "$RUNNER_TEMP/package"
          Scripts/package-linux.sh "$RUNNER_TEMP/package/ShareX-$SHAREX_VERSION-linux-${{ matrix.arch }}.tar.gz" "$RUNNER_TEMP/package"

      # Each format is installed the way a user would and must start, take a screenshot and close.
      - name: Run the tarball
        run: |
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/package/ShareX-$SHAREX_VERSION-linux-${{ matrix.arch }}.tar.gz"
          PREFIX="$RUNNER_TEMP/local" "$RUNNER_TEMP/ShareX-$SHAREX_VERSION-linux-${{ matrix.arch }}/install.sh"
          Scripts/smoke-test-linux.sh "$RUNNER_TEMP/local/bin/sharex"

      - name: Run the .deb
        run: |
          sudo apt-get install -yq "$RUNNER_TEMP/package/ShareX-$SHAREX_VERSION-linux-${{ matrix.arch }}.deb"
          Scripts/smoke-test-linux.sh /usr/bin/sharex
          sudo apt-get remove -yq sharex

      # The runner has no FUSE, so the AppImage is unpacked and started through its AppRun.
      - name: Run the AppImage
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/package/ShareX-$SHAREX_VERSION-linux-${{ matrix.arch }}.AppImage" --appimage-extract >/dev/null
          "$GITHUB_WORKSPACE/Scripts/smoke-test-linux.sh" "$RUNNER_TEMP/squashfs-root/AppRun"

      - name: Install the .rpm on Fedora
        run: |
          docker run --rm -v "$RUNNER_TEMP/package:/package:ro" fedora:latest \
            dnf install -yq "/package/ShareX-$SHAREX_VERSION-linux-${{ matrix.arch }}.rpm"

      # One artifact per format, so each download holds only the file wanted. The names are the file names; the tarball keeps
      # the extensionless name earlier builds used.
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: ShareX-${{ env.SHAREX_VERSION }}-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/package/ShareX-${{ env.SHAREX_VERSION }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: ShareX-${{ env.SHAREX_VERSION }}-linux-${{ matrix.arch }}.deb
          path: ${{ runner.temp }}/package/ShareX-${{ env.SHAREX_VERSION }}-linux-${{ matrix.arch }}.deb
          if-no-files-found: error

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: ShareX-${{ env.SHAREX_VERSION }}-linux-${{ matrix.arch }}.rpm
          path: ${{ runner.temp }}/package/ShareX-${{ env.SHAREX_VERSION }}-linux-${{ matrix.arch }}.rpm
          if-no-files-found: error

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ShareX-${{ env.SHAREX_VERSION }}-linux-${{ matrix.arch }}.AppImage
          path: ${{ runner.temp }}/package/ShareX-${{ env.SHAREX_VERSION }}-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error
